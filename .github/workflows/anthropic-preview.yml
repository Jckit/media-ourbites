name: Render Anthropic silent storyboard preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anthropic-preview.yml'
      - 'episodes/002/episode.json'
      - 'episodes/002/financials.json'
      - 'src/AnthropicShort.tsx'
      - 'src/OurbitesHost.tsx'
      - 'src/ReviewedMediaInsert.tsx'
      - 'src/anthropic-approved-media.json'

permissions:
  contents: read

jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck before rendering
        run: npm run typecheck
      - name: Validate mandatory protagonist draft cast
        run: python3 scripts/validate_character_cast.py episodes/002/episode.json
      - name: Ensure storyboard has no externally sourced media
        run: python3 scripts/verify_anthropic_media.py
      - name: Render still frame (accounting reconciliation)
        run: npx remotion still src/index.tsx AnthropicShort out/anthropic-preview-still.png --frame=1150 --scale=0.5
      - name: Render silent storyboard MP4 at preview resolution
        run: npx remotion render src/index.tsx AnthropicShort out/anthropic-preview-silent.mp4 --scale=0.5 --concurrency=2
      - name: Upload private preview files
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-episode-002-silent-preview
          path: |
            out/anthropic-preview-still.png
            out/anthropic-preview-silent.mp4
          retention-days: 14
          if-no-files-found: error

# The result is a silent, unapproved editorial storyboard.
# No third-party footage is downloaded, no TTS is generated,
# no video is uploaded to YouTube and no approval receipt is forged.
