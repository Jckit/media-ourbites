name: Validate Ourbites research and storyboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python editorial and media research tests
        run: python -m unittest discover -s tests -v
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: npm run typecheck

# Intentionally does not download or publish media, run copyright searches,
# call commercial AI APIs, or create a fictional human approval.
