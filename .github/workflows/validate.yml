name: Validate Ourbites research and storyboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse the local PowerShell scheduler and runner
        shell: pwsh
        run: |
          $paths = @('scripts/viewer-loop-20m.ps1', 'scripts/install-viewer-loop-task.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "Parsed $path"
          }
      - name: Python editorial and media research tests
        run: python -m unittest discover -s tests -v
      - name: Check declared character cast for Ourbites draft episodes
        run: |
          python scripts/validate_character_cast.py episodes/002/episode.json
          python scripts/validate_character_cast.py examples/merger-v2.json
      - name: Verify local reviewed-media registry (graphics-only draft)
        run: python scripts/verify_anthropic_media.py
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: npm run typecheck

# Intentionally does not download or publish media, run copyright searches,
# call commercial AI APIs, or create a fictional human approval.
