name: Bootstrap missing Ourbites grid PNGs
on:
  push:
    branches:
      - chore/ourbites-grid-six-colors-20261103
    paths:
      - '.github/workflows/_bootstrap-ourbites-grid-colors.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Produce three RGBA grid tones using the supplied teal grid geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          folder=Path('public/ourbites-grids')
          base=np.asarray(Image.open(folder/'teal.png').convert('RGBA'),dtype=np.uint8)
          assert base.shape==(1920,1080,4)
          # RGB tint transfer fitted to the supplied visual references.
          # Preserve the exact existing alpha/grid geometry and glow structure.
          specifications={
            'red.png': ((1.4974,-52.139),(.0785,-3.9236),(.1476,-9.5944)),
            'electric-blue.png': ((.1745,-1.0197),(.5828,-.6216),(1.2433,.1651)),
            'ice-white.png': ((1.0971,.1078),(1.1658,.075),(1.2042,.17)),
          }
          lightness=base[:,:,1].astype(np.float32)
          for filename, channels in specifications.items():
            output=np.zeros_like(base)
            output[:,:,3]=base[:,:,3]
            for channel,(slope,intercept) in enumerate(channels):
              output[:,:,channel]=np.clip(np.rint(lightness*slope+intercept),0,255).astype(np.uint8)
            Image.fromarray(output,'RGBA').save(folder/filename,optimize=True)
            assert Image.open(folder/filename).size==(1080,1920)
            assert np.array_equal(output[:,:,3],base[:,:,3])
            print(filename, (folder/filename).stat().st_size)
          PY
      - name: Commit PNGs and remove the one-time helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_bootstrap-ourbites-grid-colors.yml
          git add public/ourbites-grids/red.png public/ourbites-grids/electric-blue.png public/ourbites-grids/ice-white.png .github/workflows/_bootstrap-ourbites-grid-colors.yml
          git commit -m "assets(grid): add red, electric-blue and ice-white PNG overlays"
          git push
