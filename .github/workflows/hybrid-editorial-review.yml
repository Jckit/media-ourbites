name: Review FW-07B unified hybrid-editorial motion prototype

on:
  pull_request:
    paths:
      - 'src/framework/HybridEditorialPrototype.tsx'
      - 'src/framework/EditorialReferenceStudy.tsx'
      - 'tests/test_editorial_reference_study.py'
      - 'src/framework/paper-flight.ts'
      - 'src/framework/captions/**'
      - 'src/framework/motion/seeded-variation.ts'
      - 'tests/word-captions.test.mjs'
      - 'tests/seeded-variation.test.mjs'
      - 'tests/paper-flight.test.mjs'
      - 'src/OurbitesHost.tsx'
      - 'src/CharacterStage.tsx'
      - 'src/index.tsx'
      - '.github/workflows/hybrid-editorial-review.yml'
      - 'tests/test_hybrid_editorial_prototype.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned packages
        run: npm ci --ignore-scripts
      - name: Verify TypeScript, inherited layout and story tests
        run: |
          npm run typecheck
          node --experimental-strip-types tests/paper-flight.test.mjs
          node --experimental-strip-types tests/word-captions.test.mjs
          node --experimental-strip-types tests/seeded-variation.test.mjs
          python3 scripts/check_framework_layout.py
          python3 -m unittest discover -s tests -v
      - name: Export real phone-size silent review video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/hybrid-editorial-ci
          npx remotion render src/index.tsx HybridEditorialPrototype             out/hybrid-editorial-ci/hybrid-editorial-prototype.mp4             --scale=0.4 --codec=h264 --concurrency=2
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path=Path('out/hybrid-editorial-ci/hybrid-editorial-prototype.mp4')
          raw=subprocess.check_output(['ffprobe','-v','error','-count_frames',
            '-show_entries','stream=codec_name,codec_type,width,height,nb_read_frames,r_frame_rate:format=duration',
            '-of','json',str(path)],text=True)
          probe=json.loads(raw)
          video=next(s for s in probe['streams'] if s['codec_type']=='video')
          assert video['codec_name']=='h264', probe
          assert (video['width'],video['height']) == (432,768), probe
          assert int(video['nb_read_frames']) == 300, probe
          assert video['r_frame_rate'] == '30/1', probe
          assert abs(float(probe['format']['duration'])-10.0)<0.1, probe
          assert not any(s['codec_type']=='audio' for s in probe['streams']), probe
          Path('out/hybrid-editorial-ci/probe.json').write_text(json.dumps(probe,indent=2)+'\n')
          print('PASS: encoded H.264, 432x768, 300 frames, 30fps, 10s, no audio')
          PY
      - name: Export all motion boundary frames and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/hybrid-editorial-ci/frames
          video=out/hybrid-editorial-ci/hybrid-editorial-prototype.mp4
          # Actual previously observed host pose transitions: 34/35, 67/68, 167/168, 223/224.
          # Keep neighboring frames so a future host-only edit cannot silently skip visual QA.
          # Include matched folio-print release frames 90–150 (PR #33), alongside host pose boundaries.
          frames=(0 12 26 33 34 35 36 40 54 65 66 67 68 69 82 90 96 100 104 108 111 112 116 120 122 124 128 136 137 150 151 166 167 168 169 185 196 205 219 222 223 224 225 232 247 260 274 299)
          for n in "${frames[@]}"; do
            ffmpeg -v error -i "$video" -vf "select=eq(n\\,$n)" -vsync vfr               -frames:v 1 "out/hybrid-editorial-ci/frames/frame-$n.png"
          done
          # Contact sheet is explicitly a static timeline index, not proof of motion.
          ffmpeg -v error -i "$video" -vf "fps=2,scale=216:384,tile=5x4"             -frames:v 1 out/hybrid-editorial-ci/phone-timeline.jpg
          sha256sum "$video" src/framework/HybridEditorialPrototype.tsx             src/OurbitesHost.tsx src/AnthropicCharacter.tsx             > out/hybrid-editorial-ci/source-media-sha256.txt
          sha256sum out/hybrid-editorial-ci/frames/*.png             > out/hybrid-editorial-ci/frames-sha256.txt
          git diff --check
      - name: Render 80-percent reference-first editorial motion study
        shell: bash
        run: |
          set -euo pipefail
          npx remotion render src/index.tsx EditorialReferenceStudy \
            out/hybrid-editorial-ci/editorial-reference-80-20.mp4 \
            --scale=0.4 --codec=h264 --concurrency=2
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=codec_name,nb_read_frames,width,height,r_frame_rate -of json \
            out/hybrid-editorial-ci/editorial-reference-80-20.mp4 \
            > out/hybrid-editorial-ci/editorial-reference-probe.json
          python3 - <<'PY'
          import json
          p='out/hybrid-editorial-ci/editorial-reference-probe.json'
          v=json.load(open(p))['streams'][0]
          assert v['codec_name']=='h264'
          assert (v['width'],v['height'])==(432,768)
          assert int(v['nb_read_frames'])==300
          assert v['r_frame_rate']=='30/1'
          PY
          ffmpeg -v error -i out/hybrid-editorial-ci/editorial-reference-80-20.mp4 \
            -vf "fps=2,scale=216:384,tile=5x4" -frames:v 1 \
            out/hybrid-editorial-ci/editorial-reference-80-20-timeline.jpg
          for frame in 0 18 37 55 66 79 94 115 131 145 156 176 192 209 220 235 255 272 288 299; do
            ffmpeg -v error -i out/hybrid-editorial-ci/editorial-reference-80-20.mp4 \
              -vf "select=eq(n\\,$frame)" -vsync vfr -frames:v 1 \
              "out/hybrid-editorial-ci/editorial-reference-frame-${frame}.png"
          done
          sha256sum out/hybrid-editorial-ci/editorial-reference-80-20.mp4 \
            src/framework/EditorialReferenceStudy.tsx \
            > out/hybrid-editorial-ci/editorial-reference-sha256.txt
      - name: Render silent word-level caption fixture
        shell: bash
        run: |
          set -euo pipefail
          npx remotion render src/index.tsx WordCaptionPreview \
            out/hybrid-editorial-ci/word-caption-preview.mp4 \
            --scale=0.4 --codec=h264 --concurrency=2
          npx remotion still src/index.tsx WordCaptionPreview \
            out/hybrid-editorial-ci/word-caption-person.png --frame=95 --scale=0.4
          npx remotion still src/index.tsx WordCaptionPreview \
            out/hybrid-editorial-ci/word-caption-company.png --frame=20 --scale=0.4
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames,width,height -of json \
            out/hybrid-editorial-ci/word-caption-preview.mp4 \
            > out/hybrid-editorial-ci/word-caption-probe.json
          sha256sum out/hybrid-editorial-ci/word-caption-preview.mp4 \
            > out/hybrid-editorial-ci/word-caption-sha256.txt
      - name: Attach complete video and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw07b-hybrid-editorial-phone-preview
          path: out/hybrid-editorial-ci/
          retention-days: 14
          if-no-files-found: warn

# A green render proves technical validity only. Full human style, pacing,
# continuous visual, source and publication acceptance remain separate.
